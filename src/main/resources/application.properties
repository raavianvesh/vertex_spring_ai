server.port=8080
spring.application.name=gemini-app

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.vertex.ai.gemini.project-id=collab-verse-466620
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-flash
spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.chat.options.top-k=32
spring.ai.vertex.ai.gemini.chat.options.top-p=0.9
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=1024

spring.graphql.graphiql.enabled=true

aws.s3.bucket-name=vertex-spring-ai-local-stack-s3-document-store
aws.sqs.queue-name=vertex-spring-ai-local-stack-sqs-queue
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.endpoint=http://localhost:4566

springdoc.swagger-ui.path=/swagger-ui.html
spring.docker.compose.file=./localstack/docker-compose.yaml